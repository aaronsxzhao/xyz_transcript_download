name: Continuous Testing

on:
  # Run every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Run on push to main
  push:
    branches: [main]
  
  # Run on pull requests
  pull_request:
    branches: [main]
  
  # Allow manual trigger
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DEFAULT_DEPLOY_URL: 'https://aipodcastsummary.online'

jobs:
  frontend:
    name: Frontend Checks
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Test frontend
        run: npm test -- --maxWorkers=2
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Prepare browser validation dependencies
        timeout-minutes: 8
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BASE_REVISION"
          else
            BASE_REVISION=HEAD
          fi
          mkdir -p /tmp/library-baseline
          git archive "$BASE_REVISION" web/dist | tar -x -C /tmp/library-baseline
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check appearance and retained state
        timeout-minutes: 5
        run: |
          mkdir -p appearance-checks
          python scripts/check_appearance.py | tee appearance-checks/chromium.log
          python scripts/check_appearance.py --webkit --widths 390 | tee appearance-checks/webkit.log
          python scripts/check_tablet_controls.py | tee appearance-checks/tablet-chromium.log
          python scripts/check_tablet_controls.py --webkit --widths 744 820 1024 | tee appearance-checks/tablet-webkit.log
      - name: Upload appearance failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-failure-pr
          path: appearance-checks/
          if-no-files-found: ignore
      - name: Check authentication form interactions
        timeout-minutes: 3
        run: |
          python scripts/check_auth_forms.py
          python scripts/check_auth_forms.py --webkit --widths 390
      - name: Check podcast form interactions
        timeout-minutes: 3
        run: |
          python scripts/check_podcast_forms.py
          python scripts/check_podcast_forms.py --webkit --widths 390
      - name: Check Editorial components and long titles
        timeout-minutes: 10
        run: python scripts/check_editorial_components.py
      - name: Check Classic components and long titles
        timeout-minutes: 10
        run: python scripts/check_editorial_components.py --design classic --output /tmp/classic-component-checks
      - name: Check global notification themes and keyboard dismissal
        timeout-minutes: 3
        run: |
          python scripts/check_global_feedback.py
          python scripts/check_global_feedback.py --webkit --output /tmp/global-feedback-webkit
      - name: Check rich summary themes and article interactions
        timeout-minutes: 5
        run: |
          python scripts/check_summary_theme.py
          python scripts/check_summary_theme.py --webkit --output /tmp/summary-theme-webkit
      - name: Check Editorial components in WebKit
        timeout-minutes: 10
        run: python scripts/check_editorial_components.py --webkit --widths 390
      - name: Upload Editorial failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-component-failure
          path: /tmp/editorial-component-checks/
          if-no-files-found: ignore
      - name: Check mobile controls in Chromium
        timeout-minutes: 5
        run: python scripts/check_mobile_controls.py
      - name: Check mobile controls in WebKit
        timeout-minutes: 5
        run: python scripts/check_mobile_controls.py --webkit --widths 320 390 430
      - name: Check Editorial light interactions
        timeout-minutes: 5
        run: |
          python scripts/check_mobile_controls.py --webkit --widths 390 820 --design editorial --theme light
          python scripts/check_reader_themes.py
      - name: Check WebKit reader and document startup
        timeout-minutes: 5
        run: |
          python scripts/check_reader_layout.py --webkit
          python scripts/check_document_startup.py --baseline-dist /tmp/library-baseline/web/dist --webkit
          python scripts/check_page_boundaries.py --baseline-dist /tmp/library-baseline/web/dist --webkit
      - name: Check library navigation and loading
        timeout-minutes: 5
        run: |
          python scripts/check_library_browser.py --baseline-dist /tmp/library-baseline/web/dist
          python scripts/check_page_loading.py --baseline-dist /tmp/library-baseline/web/dist
      - name: Check reader interactions and exports
        timeout-minutes: 5
        run: |
          python scripts/check_reader_interactions.py
          python scripts/check_unified_readers.py
      - name: Check reader recovery from stalled modules
        timeout-minutes: 3
        run: python scripts/check_reader_recovery.py
      - name: Check task workspace and performance
        timeout-minutes: 5
        run: |
          python scripts/check_workspace_visuals.py
          python scripts/check_task_workspace.py
          python scripts/check_processing_progress.py
          python scripts/check_processing_progress.py --webkit --widths 390
          python scripts/check_performance_backlog.py
          python scripts/check_dashboard_recent.py
          python scripts/check_dashboard_recent.py --webkit --widths 390
      - name: Check first paint and connection recovery
        timeout-minutes: 5
        run: |
          python scripts/check_first_paint.py
          python scripts/check_network_resilience.py --baseline-dist /tmp/library-baseline/web/dist

  appearance-monitor:
    name: Scheduled Appearance Checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scheduled-appearance-checks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build current frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Prepare browsers
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check appearance and retained state
        run: |
          mkdir -p appearance-checks
          python scripts/check_appearance.py | tee appearance-checks/chromium.log
          python scripts/check_appearance.py --webkit --widths 390 | tee appearance-checks/webkit.log
          python scripts/check_tablet_controls.py | tee appearance-checks/tablet-chromium.log
          python scripts/check_tablet_controls.py --webkit --widths 744 820 1024 | tee appearance-checks/tablet-webkit.log
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-failure-scheduled
          path: appearance-checks/
          if-no-files-found: ignore

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Set test environment variables
        run: |
          echo "USE_SUPABASE=false" >> $GITHUB_ENV
          echo "WHISPER_MODE=local" >> $GITHUB_ENV
          echo "LLM_API_KEY=test-key" >> $GITHUB_ENV
          echo "LLM_BASE_URL=https://test.api.com" >> $GITHUB_ENV
          echo "LLM_MODEL=test-model" >> $GITHUB_ENV
      
      - name: Run tests with coverage
        id: pytest
        run: |
          python -m pytest tests/ \
            --cov=api \
            --cov=database \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v \
            --tb=short \
            2>&1 | tee test-output.txt
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            test-output.txt
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true
      
      - name: Check test results
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "::error::Tests failed! Check the test output for details."
          exit 1
      
      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read test output
            let testOutput = '';
            try {
              testOutput = fs.readFileSync('test-output.txt', 'utf8');
              // Truncate if too long
              if (testOutput.length > 5000) {
                testOutput = testOutput.slice(-5000);
              }
            } catch (e) {
              testOutput = 'Could not read test output';
            }
            
            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-test,bug',
              per_page: 5
            });
            
            // Check if there's already an issue for test failures
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('[Auto] Test Failure')
            );
            
            const timestamp = new Date().toISOString();
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const body = `## Automated Test Failure Report
            
            **Time**: ${timestamp}
            **Workflow Run**: [View Run](${runUrl})
            **Trigger**: Scheduled (every 30 minutes)
            
            ### Test Output (last 5000 chars)
            
            \`\`\`
            ${testOutput}
            \`\`\`
            
            ### Next Steps
            
            1. Review the test output above
            2. Check the [workflow run](${runUrl}) for full details
            3. Fix the failing tests
            4. Close this issue when resolved
            
            ---
            *This issue was automatically created by the continuous testing workflow.*
            `;
            
            if (existingIssue) {
              // Update existing issue with new failure info
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### New Failure at ${timestamp}\n\n${body}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Auto] Test Failure - ${timestamp.split('T')[0]}`,
                body: body,
                labels: ['automated-test', 'bug']
              });
              console.log('Created new issue for test failure');
            }

  # Separate job to run on schedule only - checks API health
  health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Check deployed API health
        id: health
        run: |
          # Replace with your actual deployed URL
          DEPLOY_URL="${DEPLOY_URL_OVERRIDE:-${{ env.DEFAULT_DEPLOY_URL }}}"
          
          echo "Checking health at: $DEPLOY_URL/api/health"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/health" || echo "000")
          
          echo "Response code: $RESPONSE"
          
          if [ "$RESPONSE" != "200" ]; then
            echo "::warning::API health check failed with status $RESPONSE"
            echo "health_status=unhealthy" >> $GITHUB_OUTPUT
          else
            echo "API is healthy"
            echo "health_status=healthy" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Report unhealthy status
        if: steps.health.outputs.health_status == 'unhealthy'
        run: |
          echo "::warning::The deployed API may be unhealthy. Check Render dashboard."

  # Summary job
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed. Check the test job for details."
            exit 1
          fi
