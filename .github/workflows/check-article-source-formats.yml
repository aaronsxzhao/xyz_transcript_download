name: Check public article source formats
on:
  workflow_dispatch:
  push:
    branches: [main, fix/article-source-formatting-20261026]
    paths: ['social_content.py', 'source_rich_text.py', 'scripts/check_article_source_formats.py', '.github/workflows/check-article-source-formats.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 markdown-it-py
      - run: python scripts/check_article_source_formats.py
