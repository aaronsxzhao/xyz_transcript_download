name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'api/**'
      - 'web/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-cloud.txt'
      - 'scripts/verify_deployment.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-oracle.yml'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  OCIR_REGISTRY: iad.ocir.io
  OCIR_NAMESPACE: ide2oawxnq9y
  OCIR_REPO: podcast-tool
  OCI_REGION: us-ashburn-1
  CONTAINER_INSTANCE_ID: ocid1.computecontainerinstance.oc1.iad.anuwcljrram2hqqaueqbs2y4opn3tm2jfpmx4a7gdsscygwyjgnac5vrqgta
  COMPARTMENT_ID: ocid1.compartment.oc1..aaaaaaaaorvzawio5acl4awquwshitqthiu7yp3k7muym47wv632talxpuoa
  SUBNET_ID: ocid1.subnet.oc1.iad.aaaaaaaahxx7dhu37m5enxzaolx6lxir6iz4pp3sp3o75dcxcy5gw5nyh5fa

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ env.OCIR_NAMESPACE }}/vincentjyzhao@gmail.com
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Verify preserved rollback image exists
        run: |
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:74c5138d751abb1cf61f186bdd3593223486c365" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:3a2a4fe27aad16d2ff936d787db33042deda5971" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:440009e42e7574a45fddca717e5451dd98d2cb15" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:aca4f9bb29b90cb08b1fef6a97ab4f8efdd3d7e9" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:d3fe060e8e7046a3a359b7f57765f8a38f92a49d" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:c460b553cca557aa4c56beba986cd7aaad79f506" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:10ed582f084d2633e7b43e4008f3398c742f33c8" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:2bee12fc16f122b536fc56adf36c45ee054b3a84" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:1275fbc876542df16266ea212084b4db9d8a56f0" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:8db4bcd17f03dff9ee0ff40a08389b1636ad0365" > /dev/null
          docker buildx imagetools inspect "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:c5ead130ad344c7b698170e6ce68e6919899b5c3" > /dev/null

      - name: Reject obsolete queued release
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ github.sha }}"

      - name: Build and push ARM image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPO }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPO }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPO }}:buildcache,mode=max
            type=gha,mode=max

      - name: Install and configure OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_REGION: ${{ env.OCI_REGION }}
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=~/.oci/key.pem\n' \
            "${OCI_CLI_USER}" "${OCI_CLI_FINGERPRINT}" "${OCI_CLI_TENANCY}" "${OCI_CLI_REGION}" \
            > ~/.oci/config

      - name: Restart Container Instance
        run: |
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CURRENT_MAIN" != "${{ github.sha }}" ]; then
            echo "Skipping obsolete release: main advanced during the build."
            exit 1
          fi
          docker buildx imagetools create --tag "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:latest" "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:${{ github.sha }}"
          echo "Restarting container instance..."
          oci container-instances container-instance restart \
            --container-instance-id ${{ env.CONTAINER_INSTANCE_ID }}
          sleep 5
          for i in $(seq 1 18); do
            STATE=$(oci container-instances container-instance get \
              --container-instance-id ${{ env.CONTAINER_INSTANCE_ID }} \
              --query 'data."lifecycle-state"' --raw-output)
            echo "Attempt $i: State=$STATE"
            if [ "$STATE" = "ACTIVE" ]; then
              echo "Container is active!"
              exit 0
            fi
            sleep 10
          done
          echo "Container did not become active"
          exit 1

      - name: Verify health
        id: verify
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python scripts/verify_deployment.py

      - name: Restore preserved image if release verification fails
        if: failure() && steps.verify.outcome == 'failure'
        env:
          EXPECTED_REVISION: 74c5138d751abb1cf61f186bdd3593223486c365
        run: |
          docker buildx imagetools create --tag "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:latest" "$OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPO:$EXPECTED_REVISION"
          oci container-instances container-instance restart --container-instance-id "$CONTAINER_INSTANCE_ID"
          python scripts/verify_deployment.py
