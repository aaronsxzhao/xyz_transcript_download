name: One-time focused-reading samples

on:
  push:
    branches: [review/focused-reading-samples-20261028]
    paths: ['scripts/run_focused_reading_samples.py', '.github/workflows/focused-reading-samples.yml']

permissions:
  contents: read

concurrency:
  group: isolated-reading-budget-ab
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTAINER_INSTANCE_ID: ocid1.computecontainerinstance.oc1.iad.anuwcljrram2hqqaueqbs2y4opn3tm2jfpmx4a7gdsscygwyjgnac5vrqgta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure existing deployment maintenance client
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          pip install oci-cli -r requirements-cloud.txt
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=us-ashburn-1\nkey_file=~/.oci/key.pem\n' \
            "$OCI_CLI_USER" "$OCI_CLI_FINGERPRINT" "$OCI_CLI_TENANCY" > ~/.oci/config
      - name: Probe the saved provider and generate private review samples
        run: python scripts/run_focused_reading_samples.py
      - name: Upload encrypted review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-focused-reading-samples
          path: /tmp/xyz-review-artifacts/focused-reading-samples.enc.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
