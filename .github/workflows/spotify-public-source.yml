name: Spotify public source check
on:
  push:
    branches: [fix/spotify-public-rss]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 python-dotenv rich
      - run: python scripts/check_spotify_public.py
