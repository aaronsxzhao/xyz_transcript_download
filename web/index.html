<!doctype html>
<html lang="zh" class="dark" data-design="classic" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => { const root = document.documentElement; let design = 'classic', theme = 'dark'; try { if(localStorage.getItem('xyz:design') === 'editorial') design = 'editorial'; if(localStorage.getItem('xyz:color-theme') === 'light') theme = 'light'; } catch {} root.dataset.design = design; root.dataset.theme = theme; root.classList.toggle('dark', theme === 'dark'); })();
    </script>
    <style>
      html,body{margin:0;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #startup-shell header{height:48px;display:flex;align-items:center;gap:24px;padding:0 20px;background:#1e293b;border-bottom:1px solid #334155}
      #startup-shell a{color:#d1d5db;text-decoration:none;font-size:14px;white-space:nowrap;padding:8px;border-radius:6px}
      #startup-shell a[aria-current=page]{background:#4f46e5;color:white}
      #startup-shell nav{display:flex;gap:8px;overflow:auto}#startup-shell strong{white-space:nowrap;font-size:14px}
      #startup-shell main{padding:24px}#startup-shell h1{font-size:28px;margin:8px 0 16px}#startup-shell p{color:#cbd5e1;font-size:14px}
      #startup-shell .placeholders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}
      #startup-shell .placeholder{height:160px;background:#1e293b;border:1px solid #334155;border-radius:12px}
      #startup-shell button{padding:10px 16px;background:#4f46e5;color:white;border:0;border-radius:8px;cursor:pointer}
      #startup-shell a:focus-visible,#startup-shell button:focus-visible{outline:2px solid #c7d2fe;outline-offset:2px}
      @media(max-width:700px){#startup-shell header{gap:8px;padding:0 8px}#startup-shell strong{display:none}#startup-shell main{padding:16px}#startup-shell nav{gap:0}}
      html[data-theme=light],html[data-theme=light] body{background:#f5f7fb;color:#253247}
      html[data-theme=light] #startup-shell :is(header,.placeholder){background:#fff;border-color:#dbe2ec}
      html[data-theme=light] #startup-shell :is(a:not([aria-current]),p){color:#526176}
      html[data-design=editorial][data-theme=light],html[data-design=editorial][data-theme=light] body{background:#fcfbf8}
    </style>
    <title>Podcast Transcript Tool</title>
  </head>
  <body class="bg-dark-bg text-gray-100">
    <div id="root"><div id="startup-shell" aria-busy="true">
      <header><strong>Podcast &amp; Video Tool</strong><nav aria-label="Main navigation">
        <a data-startup-nav href="/">Dashboard</a><a data-startup-nav href="/library">Library</a><a data-startup-nav href="/podcasts">Podcasts</a><a data-startup-nav href="/videos">Videos</a><a data-startup-nav href="/settings">Settings</a>
      </nav></header>
      <main><h1 id="startup-title">Your workspace</h1><p id="startup-status" role="status">Loading your page…</p><button id="startup-retry" hidden>Retry loading</button><div class="placeholders" aria-hidden="true"><div class="placeholder"></div><div class="placeholder"></div><div class="placeholder"></div></div></main>
    </div></div>
    <!-- xyz-startup -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
